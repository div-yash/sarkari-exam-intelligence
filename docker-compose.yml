services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sei-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
      MSSQL_PID: "Express"
    ports:
      - "${SQL_PORT:-14330}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sei-api
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Production}"
      EnableSwagger: "${ENABLE_SWAGGER:-false}"
      DatabaseProvider: "SqlServer"
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=SarkariExamIntelligenceDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      Jwt__Key: "${JWT_KEY}"
      Jwt__Issuer: "${JWT_ISSUER:-SarkariExamIntelligence}"
      Jwt__Audience: "${JWT_AUDIENCE:-SarkariExamIntelligenceClient}"
      Jwt__ExpiryMinutes: "${JWT_EXPIRY_MINUTES:-720}"
      Cors__AllowedOrigins__0: "${PUBLIC_ORIGIN:-http://localhost:8080}"
      Email__SmtpHost: "${SMTP_HOST:-}"
      Email__SmtpPort: "${SMTP_PORT:-587}"
      Email__EnableSsl: "${SMTP_SSL:-true}"
      Email__FromAddress: "${SMTP_FROM:-alerts@sarkariexamintelligence.in}"
      Email__Username: "${SMTP_USER:-}"
      Email__Password: "${SMTP_PASSWORD:-}"
    ports:
      - "${API_PORT:-5019}:8080"
    volumes:
      - api_uploads:/app/wwwroot/notifications
      - api_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sei-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  sqlserver_data:
  api_uploads:
  api_logs:
