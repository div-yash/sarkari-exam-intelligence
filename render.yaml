services:
  - type: web
    name: sarkari-exam-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: EnableSwagger
        value: "true"
      - key: ConnectionStrings__DefaultConnection
        sync: false # Paste your Neon.tech PostgreSQL connection string here
      - key: Jwt__Key
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false # e.g., https://sarkari-exam.vercel.app
