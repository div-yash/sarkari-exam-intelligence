name: CI/CD Build & Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore backend/SarkariExamIntelligence.slnx
      - run: dotnet build backend/SarkariExamIntelligence.slnx -c Release --no-restore
      - run: dotnet test backend/tests/SarkariExamIntelligence.UnitTests/SarkariExamIntelligence.UnitTests.csproj -c Release --no-build
      - run: dotnet test backend/tests/SarkariExamIntelligence.IntegrationTests/SarkariExamIntelligence.IntegrationTests.csproj -c Release --no-build
      - run: dotnet run --project backend/tests/SarkariExamIntelligence.VerificationSuite/SarkariExamIntelligence.VerificationSuite.csproj -c Release --no-build

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm --prefix frontend ci
      - run: npm --prefix frontend run build
      - run: npm --prefix frontend test -- --watch=false

  docker-build-check:
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose --env-file .env.example build
