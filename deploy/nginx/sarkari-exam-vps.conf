# Standalone Linux VPS Nginx Reverse Proxy + TLS Termination (Certbot / Let's Encrypt)
server {
    listen 80;
    server_name exams.example.in;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name exams.example.in;

    ssl_certificate     /etc/letsencrypt/live/exams.example.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/exams.example.in/privkey.pem;

    root /var/www/sarkari-exam-intelligence/frontend;
    index index.html;
    client_max_body_size 25M;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /api/ {
        proxy_pass http://127.0.0.1:5019/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /notifications/ {
        proxy_pass http://127.0.0.1:5019/notifications/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
